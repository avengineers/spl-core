[source]
exclude = [".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".svn", ".venv", ".vscode", "_build", "dist", "node_modules", "site-packages"]
respect_gitignore = false
extend_include = ["build/**/__source_docs/**"]

[needs.links.realizes]
incoming = "is realized by"
outgoing = "realizes"

[needs.links.fulfills]
incoming = "is fulfilled by"
outgoing = "fulfills"

[needs.links.refines]
incoming = "is refined by"
outgoing = "refines"

[needs.links.implements]
incoming = "is implemented by"
outgoing = "implements"

[needs.links.results]
incoming = "results from"
outgoing = "results"

[needs.links.verifies]
incoming = "is verified by"
outgoing = "verifies"

[needs.links.tests]
incoming = "is tested by"
outgoing = "tests"

[needs.fields.integrity]
default = ""

[[needs.types]]
directive = "arch"
title = "Architecture"
prefix = "A_"
color = "#DF744A"
style = "node"

[[needs.types]]
directive = "req"
title = "Requirement"
prefix = "R_"
color = "#BFD8D2"
style = "node"

[[needs.types]]
directive = "spec"
title = "Specification"
prefix = "S_"
color = "#FEDCD2"
style = "node"

[[needs.types]]
directive = "impl"
title = "Implementation"
prefix = "I_"
color = "#DF744A"
style = "node"

[[needs.types]]
directive = "test"
title = "Test Case"
prefix = "T_"
color = "#DCB239"
style = "node"
