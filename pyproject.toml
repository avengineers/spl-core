[tool.poetry]
name = "spl-core"
version = "8.5.1"
description = "Software Product Line Support for CMake"
authors = ["Avengineers <karsten.guenther@kamg.de>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/avengineers/spl-core"
documentation = "https://spl-core.readthedocs.io"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
packages = [{ include = "spl_core", from = "src" }]

[tool.poetry.scripts]
please = "spl_core.main:main"
junit_merger = "spl_core.test_utils.junit_merger:main"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/avengineers/spl-core/issues"
"Changelog" = "https://github.com/avengineers/spl-core/blob/develop/CHANGELOG.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
py-app-dev = "^2.1"
cookiecutter = "==2.7.1"
gcovr = "^8.6"
hammocking = "^1.0"
clanguru = ">=0,<1"
kconfiglib = "^14.1"
typer = ">=0,<1"
sphinx = ">=8.1,<9.0"
# Hard upper bound: report_generation/static/spl_custom.css overrides theme-internal
# layout classes (.bd-page-width, .bd-article-container, .bd-sidebar-primary) for the
# full-width SPLE platform look. PyData has no supported full-width option, so a minor
# theme bump can change these internals. Re-validate spl_custom.css before raising <0.19.
pydata-sphinx-theme = ">=0.18,<0.19"
sphinxcontrib-mermaid = ">=0.9,<2.1"
sphinx-needs = ">=7,<9"
sphinx-test-reports = "^1.0"
sphinxcontrib-datatemplates = "^0.11"
sphinxcontrib-plantuml = ">=0.29,<0.32"
sphinx-copybutton = "^0.5"
sphinx-new-tab-link = ">=0.4,<0.9"
myst-parser = ">=0.16"
mlx-traceability = ">=10,<12"
sphinx-book-theme = "^1.1"
sphinx-design = ">=0.5,<0.7"
pypeline-semantic-release = ">=0.5,<1.0"
pypeline-runner = ">=1,<=2"
junitparser = "*"

[tool.poetry.group.dev.dependencies]
pytest = ">=7,<10"
pytest-cov = ">=4,<8"
pre-commit = ">=3.1.1,<5.0.0"
ruff = ">=0,<1"
jinja2 = "^3.1"
# Unpinned on purpose: newer testfixtures requires Python >=3.11, so Poetry must
# pick a compatible version per interpreter across our >=3.10 support range.
testfixtures = "*"
python-semantic-release = "^9.16.1"
beautifulsoup4 = "^4.12"

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variables = [
    "src/spl_core/__init__.py:__version__",
    "docs/conf.py:release",
]
build_command = "pip install poetry && poetry build"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["chore*", "ci*"]

[tool.semantic_release.changelog.environment]
keep_trailing_newline = true

[tool.semantic_release.branches.main]
match = "develop"

[tool.semantic_release.branches.noop]
match = "(?!develop$)"
prerelease = true

[tool.pytest.ini_options]
addopts = " -vv --capture=tee-sys --junitxml=out/test-report.xml --cov=spl_core --cov-report=xml:out/coverage.xml --cov-report=term-missing"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
junit_logging = "all"
markers = [
    "integration: mark a test as an integration test",
    "unit: mark a test as a unit test",
]

[tool.coverage.run]
branch = true
source = ["spl_core"]
relative_files = true

# Map the installed package back to the source tree so Codecov shows coverage
# against src/spl_core regardless of whether tests import the editable checkout
# or the copy Poetry installs into the venv's site-packages.
[tool.coverage.paths]
source = ["src/spl_core", "*/site-packages/spl_core", "*\\site-packages\\spl_core"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.ruff]
target-version = "py313"
line-length = 220
lint.ignore = [
    "D203", # 1 blank line required before class docstring
    "D212", # Multi-line docstring summary should start at the first line
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in `__init__`
    "D401", # First line of docstring should be in imperative mood
    "S603", # subprocess calls with shell=True
]
lint.select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit
    "F",   # pyflake
    "E",   # pycodestyle
    "W",   # pycodestyle
    "UP",  # pyupgrade
    "I",   # isort
    "RUF", # ruff specific
]
exclude = ["bootstrap.py", "src/spl_core/kickstart/templates/project/conf.py"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["D100", "D101", "D102", "D103", "D104", "S101"]
"setup.py" = ["D100"]
"conftest.py" = ["D100"]
"docs/conf.py" = ["D100"]
"**/test_*.py" = ["S101"]
"src/spl_core/test_utils/base_variant_test_runner.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["spl_core", "tests"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
mypy_path = "src/"
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
exclude = ['docs/.*', 'setup.py']

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[[tool.mypy.overrides]]
module = "docs.*"
ignore_errors = true







[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
